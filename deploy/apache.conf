<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot "/srv/framework/public"

    <Directory "/srv/framework/public">
        Options -Indexes -MultiViews
        Require all granted
        AllowOverride FileInfo
        LimitRequestBody 1048576
        <Files "index.php">
            SetHandler "proxy:fcgi://127.0.0.1:9000/"
            ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{reqenv:DOCUMENT_ROOT}/index.php"
        </Files>
    </Directory>
</VirtualHost>
